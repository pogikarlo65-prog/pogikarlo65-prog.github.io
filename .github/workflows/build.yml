name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          # ✅ Removed cache: gradle — avoids restoring a broken cache

      - name: Free up disk space  # ✅ Added — runner disk can fill up fast
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h  # prints available space so you can debug if it fails again

      - name: Clear Gradle caches
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf ~/.gradle/wrapper/

      - name: Initialize npm
        run: npm init -y

      - name: Install Capacitor
        run: |
          npm install \
          @capacitor/core@5 \
          @capacitor/cli@5 \
          @capacitor/android@5

      - name: Create Capacitor config
        run: |
          echo '{
            "appId": "com.northbank.reserve",
            "appName": "Northbank Reserve",
            "webDir": "www"
          }' > capacitor.config.json

      - name: Copy website
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Add Android
        run: npx cap add android || true

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g"  # ✅ More heap
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug \
            --refresh-dependencies \
            --no-daemon \
            --no-build-cache \        # ✅ Forces fresh jar creation
            --no-configuration-cache  # ✅ Avoids stale config cache issues

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: northbank-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk