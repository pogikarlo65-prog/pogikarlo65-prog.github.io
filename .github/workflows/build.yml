name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          rm -rf ~/.gradle/caches/
          rm -rf ~/.gradle/wrapper/

      - name: Initialize npm
        run: npm init -y

      - name: Install Capacitor
        run: |
          npm install \
          @capacitor/core@5 \
          @capacitor/cli@5 \
          @capacitor/android@5

      - name: Create Capacitor config
        run: |
          echo '{
            "appId": "com.northbank.reserve",
            "appName": "Northbank Snezhnaya Archive",
            "webDir": "www"
          }' > capacitor.config.json

      - name: Copy website
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Add Android
        run: npx cap add android || true

      - name: Set app name
        run: |
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Northbank Snezhnaya Archive<\/string>/' android/app/src/main/res/values/strings.xml

      - name: Set app icon
        run: |
          sudo apt-get install -y imagemagick
          for size in 48 72 96 144 192; do
            case $size in
              48)  folder="mipmap-mdpi"    foreground=108 ;;
              72)  folder="mipmap-hdpi"    foreground=162 ;;
              96)  folder="mipmap-xhdpi"   foreground=216 ;;
              144) folder="mipmap-xxhdpi"  foreground=324 ;;
              192) folder="mipmap-xxxhdpi" foreground=432 ;;
            esac
            convert logo.png -resize ${size}x${size} android/app/src/main/res/${folder}/ic_launcher.png
            convert logo.png -resize ${size}x${size} android/app/src/main/res/${folder}/ic_launcher_round.png
            convert logo.png -resize ${foreground}x${foreground} android/app/src/main/res/${folder}/ic_launcher_foreground.png
          done

      - name: Upgrade Gradle wrapper to 8.3
        run: |
          sed -i 's/gradle-8.2.1-all/gradle-8.3-all/g' android/gradle/wrapper/gradle-wrapper.properties

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --no-build-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: northbank-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk